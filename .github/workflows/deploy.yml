name: Build and Deploy Astro site

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A pnpm-workspace.yaml-ban az esbuild és a sharp build szkriptjei
      # le vannak tiltva (allowBuilds: false). Ha a build-hez vagy futtatáshoz
      # szükség van a natív binaryjaikra, itt engedélyezzük külön a CI-ban.
      - name: Approve native builds (esbuild, sharp)
        run: pnpm approve-builds esbuild sharp

      - name: Build Astro project
        run: pnpm build

      - name: Deploy dist to main branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: main
          force_orphan: true
