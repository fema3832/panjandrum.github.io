name: Build and Deploy Astro site

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ha a workspace-ben több csomag van, cseréld le a --filter-t
      # a te Astro appod nevére vagy útvonalára, pl.:
      # run: pnpm --filter ./apps/web build
      - name: Build Astro project
        run: pnpm --filter astro-app build

      - name: Deploy dist to main branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Ha a build más helyre teszi a dist-et, itt add meg az útvonalat
          publish_dir: ./dist
          publish_branch: main
          force_orphan: true
